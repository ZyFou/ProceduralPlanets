name: CI and deploy Procedural Planets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment during migrations or a restart.
concurrency:
  group: procedural-planets-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm test
      - run: npm run test:api
      - run: bash -n scripts/deploy-vps.sh
      - run: npm run build:studio
        env:
          VITE_API_URL: https://api.procedural-planets.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: dist/studio/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ProceduralPlanets' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: studio
          path: dist/studio
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/(home|srv|var/www)/[a-zA-Z0-9_./-]+$ ]]
          [[ "$DEPLOY_PATH" != *'/../'* && "$DEPLOY_PATH" != */.. && "$DEPLOY_PATH" != */ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host planets-vps
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF
      - name: Check VPS before uploading
        run: |
          ssh planets-vps "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          command -v node npm pm2 rsync curl flock
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          test -f "$1/api/.env" || { echo 'Create api/.env on the VPS first'; exit 1; }
          test -w "$1"
          mkdir -p "$1/web"
          REMOTE
      - name: Upload frontend and API
        run: |
          set -euo pipefail
          rsync -az --delete dist/studio/ "planets-vps:$DEPLOY_PATH/web/"
          rsync -az --delete --exclude='.env' --exclude='node_modules/' --exclude='logs/' --exclude='uploads/' --exclude='storage/' api/ "planets-vps:$DEPLOY_PATH/api/"
          rsync -az scripts/deploy-vps.sh "planets-vps:$DEPLOY_PATH/deploy-vps.sh"
      - name: Migrate, restart and check health
        run: ssh planets-vps "bash '$DEPLOY_PATH/deploy-vps.sh' '$DEPLOY_PATH'"
      - name: Summary
        run: |
          printf 'Deployed commit `%s` to `%s` (web 7071, API 7070).\n' "$GITHUB_SHA" "$DEPLOY_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
